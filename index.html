<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: app shell with a slim nav; terminal = big touch cards, personal = console + live board, skärm = dark split board for the waiting room */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#111821; --muted:#5A6573; --line:#D8DEE5;
  --accent:#0F5C6E; --accent-ink:#FFFFFF; --focus:#2F7FE0;
  --c-blue:#2347D6; --c-red:#C9252C; --c-amber:#B87F00; --c-green:#1F8150; --c-violet:#6A3FC9; --c-teal:#0F7A86;
  --ok:#1E8A4C; --warn:#A86400; --bad:#C2352B;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1117; --surface:#151C25; --surface-2:#1B2430; --ink:#E7ECF2; --muted:#94A1B1; --line:#283444;
  --accent:#48B3C6; --accent-ink:#06181C; --focus:#6FA8FF;
  --c-blue:#7189FF; --c-red:#FF6268; --c-amber:#F2B636; --c-green:#4CC285; --c-violet:#A88BFF; --c-teal:#3FC1CC;
  --ok:#4CC285; --warn:#F2B636; --bad:#FF6B5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1117; --surface:#151C25; --surface-2:#1B2430; --ink:#E7ECF2; --muted:#94A1B1; --line:#283444;
  --accent:#48B3C6; --accent-ink:#06181C; --focus:#6FA8FF;
  --c-blue:#7189FF; --c-red:#FF6268; --c-amber:#F2B636; --c-green:#4CC285; --c-violet:#A88BFF; --c-teal:#3FC1CC;
  --ok:#4CC285; --warn:#F2B636; --bad:#FF6B5E; color-scheme:dark}
/* Terminal and waiting-room screen commit to one bright, daylight look whatever the device theme */
body.kiosk,.tv{--bg:#EEF4F7; --surface:#FFFFFF; --surface-2:#F5F9FB; --ink:#16212C; --muted:#5C6977; --line:#DCE4EB;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --focus:#2F7FE0;
  --c-blue:#2F5BEA; --c-red:#D23A40; --c-amber:#B97D00; --c-green:#1F8150; --c-violet:#6A3FC9; --c-teal:#0F7A86;
  --ok:#1E8A4C; --warn:#A86400; --bad:#C2352B; color-scheme:light}
.tv{--bg:#F5FAFC; --glow:#DDF0F1}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#app{display:flex;flex-direction:column;min-height:100%}
#view{flex:1;display:flex;flex-direction:column}

/* nav */
#nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;margin-right:auto}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:15px}
.tabs-nav{display:flex;gap:4px;flex-wrap:wrap}
.tabs-nav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.tabs-nav a:hover{background:var(--surface-2);color:var(--ink)}
.tabs-nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.mode-pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.mode-pill.live{color:var(--ok)}
.mode-pill.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
body.kiosk #nav{display:none}
body.kiosk.nav-open #nav{display:flex}
#kiosk-key{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px));width:44px;height:44px;border:0;background:transparent;z-index:20;border-radius:50%;display:none;touch-action:none}
body.kiosk #kiosk-key{display:block}
#kiosk-key::after{content:"";position:absolute;inset:18px;border-radius:50%;background:var(--line);opacity:.6}
#kiosk-key.holding::after{background:var(--accent);opacity:1;transition:inset 1.1s linear;inset:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.input,select.input{min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}
.input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--b,var(--muted)) 14%,transparent);color:var(--b,var(--muted));white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--b,var(--muted));flex:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--ink);border-bottom:1px solid var(--line);font-size:14px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Terminal ---------- */
.term{flex:1;display:flex;flex-direction:column;gap:24px;padding-block:28px 0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;margin:0 auto}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.t-top .clock{font-size:22px;font-weight:700}
.t-head h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;letter-spacing:-.02em}
.t-head p{font-size:clamp(18px,2.2vw,23px);color:var(--muted);margin:10px 0 0}
.t-brands{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.t-brand{--b:var(--c-blue);position:relative;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:24px;padding:26px 24px 22px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:300px;overflow:hidden;transition:transform .15s,border-color .15s}
.t-brand::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:var(--b)}
.t-brand:active{transform:scale(.98)}
.t-brand:hover{border-color:var(--b)}
.t-mark{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--b) 14%,transparent);color:var(--b);font-family:var(--display);font-weight:800;font-size:30px;margin-bottom:8px}
.t-brand-name{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.015em}
.t-brand-tag{font-size:19px;font-weight:600;color:var(--b)}
.t-brand-list{color:var(--muted);font-size:16px;margin-top:auto}
.t-brand-q{font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.t-purposes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.t-purpose{--b:var(--c-blue);text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:22px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:130px}
.t-purpose:hover{border-color:var(--b)}
.t-purpose b{font-family:var(--display);font-size:27px;font-weight:700}
.t-purpose span{color:var(--muted);font-size:17px}
.t-back{align-self:flex-start;font-size:18px;min-height:52px;padding:0 20px}
.t-form{display:grid;gap:18px;max-width:640px}
.t-form .input{min-height:68px;font-size:26px;border-radius:16px;padding:0 20px;border-width:2px}
.t-form label{font-size:18px;font-weight:600}
.t-form .btn{min-height:72px;font-size:22px;border-radius:18px}
.t-crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:18px}
.t-done{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:stretch}
.t-ticket{--b:var(--c-blue);background:color-mix(in srgb,var(--b) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--b) 25%,var(--line));border-radius:28px;padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;position:relative;overflow:hidden}
.t-ticket .who{font-family:var(--display);font-size:clamp(34px,5vw,56px);font-weight:800;line-height:1.05}
.av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--b,var(--accent)) 15%,var(--surface));color:var(--b,var(--accent));font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;box-shadow:0 0 0 3px var(--surface),0 0 0 5px color-mix(in srgb,var(--b,var(--accent)) 30%,transparent)}
.av-xl{width:clamp(96px,12vw,132px);height:clamp(96px,12vw,132px);font-size:clamp(36px,4.6vw,50px)}
.dir{flex:none;width:clamp(44px,4vw,64px);height:clamp(44px,4vw,64px);border-radius:50%;display:grid;place-items:center;background:var(--b);color:#fff;font-weight:800;font-size:clamp(22px,2.2vw,34px)}
.t-steps{display:flex;flex-direction:column;gap:14px;font-size:20px}
.t-step{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.t-step i{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-weight:700;font-family:var(--display)}
.t-step b{display:block}
.t-reset{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:17px}
.t-qr-card{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.t-qr-card .qr{flex:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.t-qr-card .qr img,.t-qr-card .qr canvas,.t-qr-card .qr table{display:block}
.t-qr-card b{display:block;font-family:var(--display);font-size:20px;margin-bottom:2px}
.t-qr-card .muted{font-size:16px}
.t-ticker{margin-top:auto;margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--ink);border-top:1px solid var(--line);display:flex;align-items:center;gap:20px;min-height:64px;overflow:hidden;
  padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.t-ticker .label{color:var(--accent)}
.t-ticker-items{display:flex;gap:28px;flex-wrap:wrap;font-size:19px;font-weight:600}
.t-ticker-items span b{font-family:var(--display);margin-right:8px}
.flash{animation:flash 1.2s ease 3}
@keyframes flash{50%{background:var(--accent);color:var(--accent-ink)}}

/* ---------- Personal ---------- */
.staff{flex:1;display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;width:100%;margin:0 auto;align-items:start}
.console{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--b:var(--muted);display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--b);background:color-mix(in srgb,var(--b) 12%,var(--surface))}
.call-next{min-height:64px;font-size:20px;border-radius:14px}
.current{--b:var(--c-blue);border:2px solid var(--b);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.current .n{font-size:44px;font-weight:800;color:var(--b);line-height:1}
.current .nm{font-family:var(--display);font-size:24px;font-weight:700}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.empty{color:var(--muted);text-align:center;padding:28px 16px;border:1.5px dashed var(--line);border-radius:var(--r)}
.board{display:flex;flex-direction:column;gap:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{--b:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .head{display:flex;align-items:center;gap:8px;font-weight:700}
.stat .v{font-size:34px;font-weight:800;line-height:1.05}
.stat .s{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.list{display:flex;flex-direction:column;gap:8px}
.row{--b:var(--muted);display:grid;grid-template-columns:44px minmax(0,1.4fr) minmax(0,1.2fr) 90px auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.row .av{width:44px;height:44px;font-size:16px;box-shadow:none}
.current .av{width:56px;height:56px;font-size:21px}
.row .nm{font-weight:700;overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--muted)}
.row .wait{font-variant-numeric:tabular-nums;font-weight:700}
.row .wait.long{color:var(--bad)}
.row .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.reg{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px;font-weight:700;letter-spacing:.06em;border:1.5px solid var(--ink);border-radius:5px;padding:1px 6px;background:var(--surface);white-space:nowrap}
.transfer{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px dashed var(--line)}
.transfer select{flex:1;min-width:180px}
details.panel summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.panel summary::after{content:"+";font-size:20px;line-height:1;color:var(--muted)}
details[open].panel summary::after{content:"–"}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- Settings ---------- */
.settings{padding-block:24px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.settings h2{font-size:24px}
.set-intro{color:var(--muted);max-width:68ch;margin:6px 0 0}
.brand-card{--b:var(--c-blue);background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--b);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.p-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr) auto auto;gap:8px;align-items:center}
.p-head{font-size:12px;color:var(--muted);font-weight:600}
.toggle{position:relative;width:48px;height:28px;flex:none}
.toggle input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--ok)}
.toggle input:checked+span::after{left:23px}
.toggle input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.d-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,170px) auto;gap:8px;align-items:center}
.g-row{display:grid;grid-template-columns:190px minmax(0,1fr) auto;gap:8px;align-items:center}
.g-max{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.g-max .input{width:84px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:flex-end;z-index:15;
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}

<script>
const DEFAULT_CONFIG = {
  brands: [
    { id:'kvdbil', name:'KVD Bil', tagline:'Bilförsäljning', prefix:'K', color:'blue', enabled:true,
      waitText:'Ta plats i loungen vid entrén',
      purposes:[
        { id:'hamta', label:'Hämta bil', hint:'Du har köpt en bil och ska hämta ut den', enabled:true, desk:'u1' },
        { id:'lamna', label:'Lämna bil', hint:'Du ska lämna in en bil som vi säljer åt dig', enabled:true, desk:'d1' },
        { id:'provkor', label:'Provkörning', hint:'Du har bokat eller vill göra en provkörning', enabled:true, desk:'d2' },
        { id:'ovrigt', label:'Övrigt ärende', hint:'Frågor om köp, betalning eller papper', enabled:true, desk:'d1' }
      ]},
    { id:'autoexperten', name:'Autoexperten', tagline:'Verkstadsbesök', prefix:'A', color:'red', enabled:true,
      waitText:'Ta plats i loungen, verkstaden ropar dig här',
      purposes:[
        { id:'inlamning', label:'Lämna in bil', hint:'Service, reparation eller däckbyte', enabled:true, desk:'v1' },
        { id:'upphamtning', label:'Hämta bil', hint:'Din bil är klar att hämtas', enabled:true, desk:'v1' }
      ]},
    { id:'carglass', name:'Carglass', tagline:'Bilglasbyte', prefix:'C', color:'amber', enabled:true,
      waitText:'Ta plats i loungen, Carglass ropar dig här',
      purposes:[
        { id:'inlamning', label:'Lämna in bil', hint:'Stenskott eller rutbyte', enabled:true, desk:'g1' },
        { id:'upphamtning', label:'Hämta bil', hint:'Ditt glasbyte är klart', enabled:true, desk:'g1' }
      ]}
  ],
  desks: [
    { id:'d1', name:'Disk 1', location:'Receptionen, vänster sida', dir:'left' },
    { id:'d2', name:'Disk 2', location:'Receptionen, höger sida', dir:'right' },
    { id:'u1', name:'Utlämningen', location:'Glasdörren mot parkering P2', dir:'straight' },
    { id:'v1', name:'Verkstadsdisken', location:'Genom korridoren till höger', dir:'right' },
    { id:'g1', name:'Carglass-disken', location:'Hall B, vid port 3', dir:'left' }
  ],
  greetings:[
    { upTo:10, text:'Välkommen' },
    { upTo:20, text:'Tack för väntan' },
    { upTo:30, text:'Äntligen' }
  ],
  greetingLong:'Tack för ditt tålamod',
  nameFormat:'short',
  screenMessage:'Välkommen! Håll utkik här, vi ropar ditt namn och visar vart du ska gå.',
  retentionDays:30,
  follow:{ enabled:true, url:'' },
  callText:'{halsning} {namn} – du har grönt ljus till {disk}',
};
const COLORS = { blue:'Blå', red:'Röd', amber:'Gul', green:'Grön', violet:'Lila', teal:'Petrol' };
const DIRS = { left:['←','till vänster'], right:['→','till höger'], straight:['↑','rakt fram'], back:['↓','bakåt'] };
const STATUS = { waiting:'Väntar', called:'Ropad', serving:'Betjänas', done:'Klar', noshow:'Kom ej' };
const VIEWS = ['terminal','skarm','personal','installningar'];

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dayStr = (t=Date.now()) => { const d=new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const clock = (t=Date.now()) => { const d=new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const mins = ms => Math.max(0, Math.floor(ms/60000));
const uid = () => Math.random().toString(36).slice(2,8);
const ls = {
  get(k,d){ try{ const v=localStorage.getItem('kolotsen.'+k); return v==null?d:JSON.parse(v); }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem('kolotsen.'+k, JSON.stringify(v)); }catch{} }
};
const clone = o => JSON.parse(JSON.stringify(o));

const S = {
  cfg:null, tickets:[], loaded:false, view:'personal', day:dayStr(),
  term:{ step:'brand', brand:null, purpose:null, result:null, resetAt:0 },
  staff:{ desk:ls.get('desk',''), brands:ls.get('brands',null), tab:'waiting', transferId:null, confirmClear:false },
  draft:null, dirty:false, seen:{}, firstSnap:true, sound:false, audio:null, navOpen:false, unsubT:null, followId:null, notify:false, alerts:false,
  user:null, authReady:false, raw:[], priv:{}, unsubP:null, followDay:null, followBrand:null
};

/* ---------- Store: Firebase Firestore when configured, otherwise an in-browser demo ----------
   tickets/{id}  public: what the terminal, TV and the customer's phone need (display name only)
   private/{id}  staff only: full name, phone and reg.nr. — readable only when signed in */
const PRIV_KEYS = ['name','phone','regnr'];
function fireStore(db){
  const splitPatch = p => {
    const pub = {}, priv = {};
    for (const [k,v] of Object.entries(p)) (PRIV_KEYS.includes(k) ? priv : pub)[k] = v;
    return [pub, priv];
  };
  return {
    live:true,
    watchConfig(cb, err){ return db.doc('config/main').onSnapshot(s => cb(s.exists ? s.data() : null, s.metadata), err); },
    watchTickets(day, cb, err, brandId){
      let q = db.collection('tickets').where('day','==',day);
      if (brandId) q = q.where('brand','==',brandId);
      return q.onSnapshot(s => cb(s.docs.map(d => ({ id:d.id, ...d.data() })), s.metadata), err);
    },
    watchPrivate(day, cb, err){
      return db.collection('private').where('day','==',day).onSnapshot(s => {
        const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); cb(m);
      }, err);
    },
    async getTicket(id){ const s = await db.doc('tickets/'+id).get(); return s.exists ? { id:s.id, ...s.data() } : null; },
    add(t){
      const { id, name, phone, regnr, ...rest } = t;
      const b = db.batch();
      b.set(db.doc('tickets/'+id), { ...rest, name:shortName(name) });
      b.set(db.doc('private/'+id), { day:t.day, name, phone:phone || '', regnr:regnr || '' });
      return b.commit();
    },
    update(id, p){
      const [pub, priv] = splitPatch(p), b = db.batch();
      if (Object.keys(pub).length) b.update(db.doc('tickets/'+id), pub);
      if (Object.keys(priv).length) b.set(db.doc('private/'+id), priv, { merge:true });
      return b.commit();
    },
    remove(id){ const b = db.batch(); b.delete(db.doc('tickets/'+id)); b.delete(db.doc('private/'+id)); return b.commit(); },
    saveConfig(c){ return db.doc('config/main').set(c); },
    async prune(cutoff){
      let n = 0;
      for (const col of ['tickets','private']){
        const s = await db.collection(col).where('day','<',cutoff).limit(400).get();
        if (!s.size) continue;
        const b = db.batch(); s.docs.forEach(d => b.delete(d.ref)); await b.commit(); n += s.size;
      }
      return n;
    }
  };
}
const fbConfigured = () => !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && window.firebase);
function memStore(){
  let cfg = null, rows = [], tl = [], cl = [];
  const emitT = () => tl.forEach(f => f.cb(rows.filter(r => r.day===f.day).map(r => ({...r})), {fromCache:false}));
  const emitC = () => cl.forEach(f => f(cfg && clone(cfg), {fromCache:false}));
  return {
    live:false,
    watchConfig(cb){ cl.push(cb); setTimeout(() => cb(cfg && clone(cfg), {fromCache:false})); return () => {}; },
    watchTickets(day, cb){ const f={day,cb}; tl.push(f); setTimeout(emitT); return () => { tl = tl.filter(x => x!==f); }; },
    watchPrivate(){ return () => {}; },
    async getTicket(id){ const r = rows.find(x => x.id===id); return r ? {...r} : null; },
    async add(t){ rows.push({...t}); emitT(); },
    async update(id, p){ const r = rows.find(x => x.id===id); if (r) Object.assign(r, p); emitT(); },
    async remove(id){ rows = rows.filter(x => x.id!==id); emitT(); },
    async saveConfig(c){ cfg = clone(c); emitC(); },
    async prune(){ return 0; }
  };
}
const stripId = t => { const { id, ...rest } = t; return rest; };
let store = null;

async function write(fn, okMsg){
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){
    toast(e?.code==='resource-exhausted' ? 'Dagens gratiskvot i Firebase är slut. Kön fungerar igen i morgon, eller uppgradera projektet.'
      : e?.code==='permission-denied' ? (S.user ? 'Databasen nekade ändringen. Kontrollera säkerhetsreglerna i Firebase.' : 'Logga in som personal för att ändra kön.')
      : e?.code==='unavailable' ? 'Ingen anslutning till databasen just nu. Försök igen om en stund.'
      : 'Kunde inte spara. Försök igen.');
    return false;
  }
}

/* ---------- Config & ticket helpers ---------- */
const cfg = () => S.cfg || DEFAULT_CONFIG;
const brandsOn = () => cfg().brands.filter(b => b.enabled !== false);
const brand = id => cfg().brands.find(b => b.id===id);
const desk = id => cfg().desks.find(d => d.id===id);
const purposeOf = t => brand(t.brand)?.purposes.find(p => p.id===t.purpose);
const bvar = b => `--b:var(--c-${b?.color || 'teal'})`;
const num = t => (brand(t.brand)?.prefix || '') + t.seq;
function shortName(n){
  n = String(n||'').trim();
  if (cfg().nameFormat === 'full') return n;
  const p = n.split(/\s+/);
  return p.length > 1 ? `${p[0]} ${p[p.length-1][0].toUpperCase()}.` : p[0];
}
function initials(n){
  const p = String(n||'').trim().split(/\s+/).filter(Boolean);
  return ((p[0]?.[0] || '') + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase();
}
function greetingFor(min){
  const m = Number.isFinite(min) ? min : 0;
  const g = [...(cfg().greetings || [])].sort((a,b) => a.upTo-b.upTo).find(x => m <= x.upTo);
  return g ? g.text : (cfg().greetingLong || 'Välkommen!');
}
const callGreeting = t => greetingFor(mins((t.calledAt || Date.now()) - t.createdAt));
const trimEnd = s => String(s || '').replace(/[\s!.,?:;–-]+$/, '');
/* The call line: "Välkommen Robert – du har grönt ljus till Disk 2". who: screen (Robert S.), speech, first (Robert) */
function callText(t, who = 'screen', html = false){
  const d = desk(t.desk);
  const namn = who === 'first' ? String(t.name || '').trim().split(/\s+/)[0]
    : who === 'speech' ? shortName(t.name).replace('.', '') : shortName(t.name);
  const v = { halsning:trimEnd(callGreeting(t)), namn, disk:d?.name || 'disken', plats:d?.location || '', foretag:brand(t.brand)?.name || '' };
  const tpl = String(cfg().callText || DEFAULT_CONFIG.callText);
  const out = tpl.split(/(\{\w+\})/).map(seg => {
    const k = (seg.match(/^\{(\w+)\}$/) || [])[1];
    if (!k || !(k in v)) return html ? esc(seg) : seg;
    if (!html) return v[k];
    return k === 'namn' ? `<span class="cn">${esc(v[k])}</span>` : k === 'disk' ? `<span class="cd">${esc(v[k])}</span>` : esc(v[k]);
  }).join('').replace(/\s+/g, ' ').trim().replace(/ ([–—-]) /g, ' $1 ');
  return out.charAt(0).toUpperCase() + out.slice(1);
}
const greet = () => { const h = new Date().getHours(); return h < 10 ? 'God morgon' : h < 18 ? 'Hej' : 'God kväll'; };
const dirOf = d => DIRS[d?.dir] || null;
const waiting = bId => S.tickets.filter(t => t.status==='waiting' && (!bId || t.brand===bId)).sort((a,b) => a.createdAt-b.createdAt);
function avgService(bId){
  const d = S.tickets.filter(t => t.brand===bId && t.status==='done' && t.doneAt && (t.servedAt || t.calledAt));
  if (d.length < 2) return 6;
  const m = d.reduce((s,t) => s + (t.doneAt - (t.servedAt || t.calledAt)), 0) / d.length / 60000;
  return Math.min(30, Math.max(2, m));
}
function estWait(bId, ahead){
  const activeDesks = new Set(S.tickets.filter(t => t.brand===bId && ['called','serving'].includes(t.status)).map(t => t.desk)).size || 1;
  return Math.round(ahead * avgService(bId) / activeDesks);
}
const waitLabel = m => m <= 1 ? 'strax' : `ca ${m} min`;
function nextSeq(bId){ return S.tickets.filter(t => t.brand===bId).reduce((m,t) => Math.max(m, t.seq||0), 0) + 1; }

/* ---------- Data subscriptions ---------- */
function mergeTickets(){ S.tickets = S.raw.map(r => S.priv[r.id] ? { ...r, ...S.priv[r.id] } : r); }
function subscribeTickets(){
  if (S.unsubT) S.unsubT();
  S.day = S.followDay || dayStr(); S.loaded = false;
  const timer = setTimeout(() => { if (!S.loaded) showBanner('Kön går inte att nå just nu. Visningen uppdateras så fort anslutningen är tillbaka.'); }, 10000);
  S.unsubT = store.watchTickets(S.day, (rows, meta) => {
    S.raw = rows; mergeTickets();
    if (!meta?.fromCache){ S.loaded = true; clearTimeout(timer); if (store.live) showBanner(''); }
    detectCalls(rows);
    renderData();
  }, () => { clearTimeout(timer); showBanner('Anslutningen till kön bröts. Ladda om sidan för att ansluta igen.'); }, S.followBrand);
  subscribePrivate();
}
function subscribePrivate(){
  if (S.unsubP){ S.unsubP(); S.unsubP = null; }
  S.priv = {};
  if (S.user && store?.live && !S.followBrand){
    S.unsubP = store.watchPrivate(S.day, m => { S.priv = m; mergeTickets(); renderData(); }, () => {});
  }
  mergeTickets();
}
function detectCalls(rows){
  const fresh = [];
  for (const t of rows){
    if (t.status !== 'called') continue;
    const c = t.callCount || 1;
    if (!S.firstSnap && (S.seen[t.id] || 0) < c) fresh.push(t);
    S.seen[t.id] = c;
  }
  S.firstSnap = false;
  if (fresh.length) announce(fresh);
}

/* ---------- Announcements ---------- */
/* A soft two-tone "ding-dong": lower notes, slow attack, quiet */
function chime(){
  if (!S.audio) return;
  const ctx = S.audio, now = ctx.currentTime;
  [[784,0],[523,.4]].forEach(([f,o]) => {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    g.gain.setValueAtTime(0, now+o); g.gain.linearRampToValueAtTime(.22, now+o+.06); g.gain.exponentialRampToValueAtTime(.001, now+o+1.5);
    osc.connect(g).connect(ctx.destination); osc.start(now+o); osc.stop(now+o+1.6);
  });
}

/* ---------- Uppläsning: en mjuk, kvinnlig svensk röst ----------
   Rösterna finns i enheten/webbläsaren, så valet sparas per skärm.
   Kvinnliga svenska röster i önskad ordning: Edge (Sofie, Hillevi – naturliga), Apple (Klara, Alva), Windows (Hedvig), Chrome (Google svenska). */
const FEMALE_SV = [/sofie/i, /hillevi/i, /klara/i, /alva/i, /hedvig/i, /google svenska/i];
const MALE_SV = /mattias|oskar|\bmale\b/i;
function svVoices(){ try { return speechSynthesis.getVoices().filter(v => /^sv([-_]|$)/i.test(v.lang)); } catch { return []; } }
function voiceRank(v){ const i = FEMALE_SV.findIndex(re => re.test(v.name)); return i >= 0 ? i : MALE_SV.test(v.name) ? 99 : 50; }
function pickVoice(){
  const vs = svVoices(); if (!vs.length) return null;
  const saved = ls.get('voice', '');
  return vs.find(v => v.name === saved) || [...vs].sort((a,b) => voiceRank(a) - voiceRank(b))[0];
}
const voiceLabel = v => v.name.replace(/^Microsoft\s+/, '').replace(/\s*-\s*Swedish.*$/i, '').replace(/Online \(Natural\)/i, '(naturlig)').trim();
function speak(text){
  try {
    const u = new SpeechSynthesisUtterance(text), v = pickVoice();
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'sv-SE';
    u.rate = .88; u.pitch = 1; u.volume = .9;   /* lugnt tempo = mjukare intryck */
    speechSynthesis.speak(u);
  } catch {}
}
const voiceSample = () => callText({ name:'Anna Svensson', brand:brandsOn()[0]?.id, desk:(cfg().desks[1] || cfg().desks[0])?.id, createdAt:Date.now(), calledAt:Date.now() }, 'speech');
function renderTvSound(){
  const el = $('#tv-sound'); if (!el) return;
  if (!S.sound){ el.innerHTML = '<button class="btn" data-act="sound">Slå på ljud och uppläsning</button>'; return; }
  const vs = svVoices().sort((a,b) => voiceRank(a) - voiceRank(b)), cur = pickVoice();
  const knownFemale = vs.some(v => voiceRank(v) < FEMALE_SV.length);
  el.innerHTML = vs.length
    ? `<label class="tv-voice">Röst <select class="input" id="tv-voice">${vs.map(v => `<option value="${esc(v.name)}" ${v === cur ? 'selected' : ''}>${esc(voiceLabel(v))}</option>`).join('')}</select></label>
       <button class="btn" data-act="voice-test">Testa</button>
       ${knownFemale ? '' : '<span class="tv-hint">Ingen kvinnlig svensk röst hittades här. Öppna skärmen i Microsoft Edge för rösten Sofie.</span>'}`
    : '<span>Ljud på</span><span class="tv-hint">Den här enheten saknar svensk röst. Öppna skärmen i Microsoft Edge för rösten Sofie.</span>';
}
try { speechSynthesis.addEventListener('voiceschanged', () => { if (S.view === 'skarm') renderTvSound(); }); } catch {}

function announce(list){
  S.justCalled = new Set(list.map(t => t.id));
  if (S.view === 'skarm' && S.sound){
    chime();
    const say = list.map(t => callText(t, 'speech')).join('. ');
    setTimeout(() => speak(say), 1300);
  }
  if (S.view === 'terminal') $('#t-ticker')?.classList.add('flash');
  if (S.view === 'folj' && S.followId){
    const mine = list.find(t => t.id === S.followId);
    if (mine) notifyFollow(mine);
  }
}

/* ---------- Routing & shell ---------- */
function route(){
  const h = location.hash.slice(1);
  const m = h.match(/^folj=(.+)$/);
  if (m) S.followId = decodeURIComponent(m[1]);
  const v = m ? 'folj' : (VIEWS.includes(h) ? h : 'personal');
  if (S.view === 'folj' && v !== 'folj' && (S.followBrand || S.followDay)){
    S.followBrand = null; S.followDay = null;
    if (store){ S.seen = {}; S.firstSnap = true; subscribeTickets(); }
  }
  if (S.view === 'installningar' && v !== 'installningar') S.draft = null;
  S.view = v;
  document.body.classList.toggle('kiosk', v==='terminal' || v==='skarm');
  document.body.classList.toggle('customer', v==='folj');
  document.body.classList.remove('nav-open'); S.navOpen = false;
  document.querySelectorAll('#tabs-nav a').forEach(a => a.dataset.v===v ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  if (v==='terminal' || v==='skarm' || v==='folj'){ try { navigator.wakeLock?.request('screen').catch(()=>{}); } catch {} }
  renderView();
}

/* ---------- Telefonnummer ---------- */
function normPhone(v){
  let d = String(v||'').trim();
  const plus = d.startsWith('+');
  d = d.replace(/\D/g,'');
  if (!d) return '';
  if (!plus){ if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0')) d = '46' + d.slice(1); }
  return d.length >= 10 && d.length <= 15 ? d : null;
}
function fmtPhone(p){
  const d = String(p||'');
  if (!d.startsWith('46')) return '+' + d;
  const l = '0' + d.slice(2);
  return l.length === 10 ? `${l.slice(0,3)}-${l.slice(3,6)} ${l.slice(6,8)} ${l.slice(8)}` : l;
}

/* ---------- Följ i mobilen ---------- */
const followOn = () => cfg().follow?.enabled !== false;
function followLink(id, base){
  base = String(base ?? cfg().follow?.url ?? '').trim() || location.href.split('#')[0];
  return base.split('#')[0] + '#folj=' + encodeURIComponent(id);
}
function renderQr(){
  const el = $('#t-qr'); if (!el || !S.term.result) return;
  const url = followLink(S.term.result.id);
  el.innerHTML = '';
  if (window.QRCode) new QRCode(el, { text:url, width:124, height:124, colorDark:'#16212C', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
  else el.innerHTML = `<span class="muted" style="font-size:11px;overflow-wrap:anywhere;max-width:140px;display:block">${esc(url)}</span>`;
}
function notifyFollow(t){
  try { navigator.vibrate?.([300,150,300,150,300]); } catch {}
  chime();
  if (S.notify && window.Notification?.permission === 'granted'){
    try {
      const d = desk(t.desk);
      new Notification('Grönt ljus – det är din tur!', { body:`${callText(t, 'first')}${d?.location ? '. ' + d.location : ''}.`, tag:'kokortet-'+t.id, renotify:true });
    } catch {}
  }
}
function updateFollow(){
  const el = $('#follow'); if (!el) return;
  const head = `<div class="f-top"><div class="logo"><i>K</i>Kökortet</div><span class="clock num" data-clock></span></div>`;
  const t = S.tickets.find(x => x.id === S.followId);
  if (!t){
    const offline = store && !store.live;
    el.innerHTML = head + `<div class="empty" style="padding:44px 20px">${
      offline ? 'Mobilen kunde inte ansluta till kön. Håll utkik på skärmen i väntrummet – där visas ditt namn när det är din tur.'

  const b = brand(t.brand), p = purposeOf(t), d = desk(t.desk), dr = dirOf(d);

      <span class="muted">${esc(b?.waitText || 'Ta plats i väntrummet')}. Den här sidan säger till när det är din tur.</span></div>`;

    card = `<div class="f-card called" style="--b:var(--ok)"><span class="label gl-label"><span class="gl"></span>Det är din tur${(t.callCount||1) > 1 ? ' – vi ropar igen' : ''}!</span>

  el.innerHTML = head + `
    <div class="f-card f-id" style="${bvar(b)}">
      <span class="av">${esc(initials(t.name))}</span>

function callPreview(c){
  const d = c.desks[1] || c.desks[0];
  const v = { halsning:trimEnd(c.greetings?.[0]?.text || c.greetingLong || ''), namn:c.nameFormat === 'full' ? 'Robert Svensson' : 'Robert S.', disk:d?.name || 'disken', plats:d?.location || '', foretag:c.brands[0]?.name || '' };
  const s = String(c.callText || '').replace(/\{(\w+)\}/g, (m,k) => k in v ? v[k] : m).replace(/\s+/g,' ').trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function setPath(obj, path, val){
  const k = path.split('.'); let o = obj;
  for (let i=0;i<k.length-1;i++) o = o[k[i]];
  o[k[k.length-1]] = val;
}
function markDirty(){ S.dirty = true; $('#dirty').textContent = 'Osparade ändringar'; document.querySelectorAll('[data-act="s-save"],[data-act="s-revert"]').forEach(b => b.disabled = false); }
function slug(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'').slice(0,16) || 'syfte'; }

/* ---------- Events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, t = id && T(id);
  switch(a){
    case 't-brand': {
      S.term.brand = id; const ps = brand(id).purposes.filter(p => p.enabled);
      if (ps.length === 1){ S.term.purpose = ps[0].id; termGo('details'); } else termGo('purpose');
      break; }
    case 't-purpose': S.term.purpose = id; termGo('details'); break;
    case 't-back': {
      const one = brand(S.term.brand)?.purposes.filter(p => p.enabled).length === 1;
      termGo(S.term.step==='details' && !one ? 'purpose' : 'brand'); break; }
    case 't-reset': termReset(); break;
    case 's-chip': {
      const set = new Set(myBrands()); set.has(id) ? set.delete(id) : set.add(id);
      S.staff.brands = [...set]; ls.set('brands', S.staff.brands); el.setAttribute('aria-pressed', set.has(id)); break; }
    case 'call-next': {
      const next = waiting().filter(x => myBrands().includes(x.brand))[0];
      if (!next){ toast('Ingen väntar i dina köer just nu.'); break; }
      await callTicket(next); break; }
    case 'call': case 'recall': if (t) await callTicket(t); break;
    case 'serve': await write(() => store.update(id, { status:'serving', servedAt:Date.now() })); break;
    case 'done': await write(() => store.update(id, { status:'done', doneAt:Date.now(), phone:'' }), 'Besöket är avslutat'); break;
    case 'noshow': await write(() => store.update(id, { status:'noshow', doneAt:Date.now() }), 'Markerad som ej på plats. Du hittar kunden under Klara.'); break;
    case 'requeue': await write(() => store.update(id, { status:'waiting', desk:'' }), 'Kunden står i kön igen'); break;
    case 's-tab': S.staff.tab = id; S.staff.transferId = null; updateStaff(); break;
    case 'transfer': S.staff.transferId = S.staff.transferId===id ? null : id; updateStaff(); break;
    case 'transfer-go': {
      const [b, p] = $('#tr-'+id).value.split('|');
      S.staff.transferId = null;
      await write(() => store.update(id, { brand:b, purpose:p, status:'waiting', desk:'' }), `Flyttad till ${brand(b)?.name}, platsen i kön behålls`); break; }
    case 'sound': {
      try { S.audio = new (window.AudioContext || window.webkitAudioContext)(); S.sound = true; chime(); } catch { toast('Ljud stöds inte på den här skärmen.'); }
      renderTvSound();
      if (S.sound) setTimeout(() => speak('Ljud och uppläsning är på.'), 1300);
      break; }
    case 'voice-test': chime(); setTimeout(() => speak(voiceSample()), 1300); break;
    case 'f-notify': {
      try { S.audio = S.audio || new (window.AudioContext || window.webkitAudioContext)(); S.audio.resume?.(); } catch {}
      S.alerts = true;
      if ('Notification' in window){
        let perm = 'denied';
        try { perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission(); } catch {}
        S.notify = perm === 'granted';
      }
      chime();
      toast(S.notify ? 'Klart – mobilen säger till när det är din tur.' : 'Klart – håll sidan öppen så plingar mobilen när det är din tur.');
      updateFollow(); break; }
    case 'p-add': { const b = S.draft.brands[el.dataset.b]; b.purposes.push({ id:'nytt'+uid(), label:'Nytt syfte', hint:'', enabled:true, desk:'' }); markDirty(); renderView(); break; }
    case 'p-del': S.draft.brands[el.dataset.b].purposes.splice(el.dataset.p, 1); markDirty(); renderView(); break;
    case 'd-add': S.draft.desks.push({ id:'s'+uid(), name:'Ny station', location:'', dir:'' }); markDirty(); renderView(); break;
    case 'g-add': {
      const g = S.draft.greetings || (S.draft.greetings = []);
      g.push({ upTo:(g.length ? (parseInt(g[g.length-1].upTo) || 0) : 0) + 10, text:'Ny hälsning' }); markDirty(); renderView(); break; }
    case 'g-del': S.draft.greetings.splice(el.dataset.i, 1); markDirty(); renderView(); break;
    case 'd-del': S.draft.desks.splice(el.dataset.i, 1); markDirty(); renderView(); break;
    case 's-revert': S.draft = clone(cfg()); S.dirty = false; renderView(); break;
    case 's-save': {
      const c = S.draft;
      c.brands.forEach(b => { b.prefix = (b.prefix||'').toUpperCase().trim() || b.name[0].toUpperCase(); b.purposes.forEach(p => { if (p.id.startsWith('nytt')) p.id = slug(p.label) + '-' + uid().slice(0,3); }); });
      c.retentionDays = Math.max(1, Math.min(365, parseInt(c.retentionDays) || 30));
      c.callText = String(c.callText || '').trim() || DEFAULT_CONFIG.callText;
      c.greetings = (c.greetings || []).map(g => ({ upTo:Math.max(0, parseInt(g.upTo) || 0), text:String(g.text || '').trim() })).filter(g => g.text).sort((a,b) => a.upTo-b.upTo);
      if (await write(() => store.saveConfig(c), 'Inställningarna är sparade')){ S.cfg = clone(c); S.draft = clone(c); S.dirty = false; renderView(); }
      break; }
    case 'demo': await addDemo(); break;
    case 'clear': S.staff.confirmClear = true; renderView(); break;
    case 'clear-no': S.staff.confirmClear = false; renderView(); break;
    case 'clear-yes': {
      S.staff.confirmClear = false;
      const ids = S.tickets.map(t => t.id);
      await write(async () => { for (const i of ids) await store.remove(i); }, `${ids.length} biljetter borttagna`);
      renderView(); break; }
    case 'logout': {
      try { await firebase.auth().signOut(); toast('Du är utloggad'); } catch { toast('Kunde inte logga ut. Försök igen.'); }
      break; }
  }
});
const AUTH_ERR = {
  'auth/invalid-credential':'Fel lösenord.', 'auth/wrong-password':'Fel lösenord.', 'auth/invalid-login-credentials':'Fel lösenord.',
  'auth/user-not-found':`Personalkontot ${STAFF_EMAIL} finns inte i Firebase. Lägg till det under Authentication → Users.`,
  'auth/too-many-requests':'För många försök. Vänta en stund och försök igen.',
  'auth/network-request-failed':'Ingen anslutning. Kontrollera nätverket och försök igen.',
  'auth/operation-not-allowed':'Inloggning med e-post och lösenord är inte påslaget i Firebase (Authentication → Sign-in method).',
  'auth/unauthorized-domain':'Den här webbadressen är inte godkänd i Firebase (Authentication → Settings → Authorized domains).'
};
document.addEventListener('input', e => {
  const k = e.target.dataset?.k; if (!k || !S.draft) return;
  setPath(S.draft, k, e.target.type==='checkbox' ? e.target.checked : e.target.value);
  markDirty();
  if (/^(callText|greetings|desks|nameFormat)/.test(k) && $('#ct-prev')) $('#ct-prev').textContent = callPreview(S.draft);
  if (e.target.hasAttribute('data-rerender')) renderView();
});
document.addEventListener('change', e => {
  if (e.target.id==='s-desk'){ S.staff.desk = e.target.value; ls.set('desk', S.staff.desk); updateStaff(); }
  if (e.target.id==='a-brand') fillPurposeSelect();
  if (e.target.id==='tv-voice'){ ls.set('voice', e.target.value); speak(voiceSample()); }
});
document.addEventListener('submit', async e => {
  if (e.target.id==='t-form') return termSubmit(e);
  if (e.target.id==='lg-form'){
    e.preventDefault();
    const btn = e.submitter || $('#lg-form button'); btn.disabled = true;
    try { await firebase.auth().signInWithEmailAndPassword(STAFF_EMAIL, $('#lg-pw').value); }
    catch(err){ toast(AUTH_ERR[err?.code] || 'Kunde inte logga in. Försök igen.'); btn.disabled = false; $('#lg-pw')?.select(); }
    return;
  }
  if (e.target.id==='s-add'){
    e.preventDefault();
    const name = $('#a-name').value.trim(); if (name.length < 2) return;
    const b = $('#a-brand').value, phone = normPhone($('#a-phone').value);
    if (phone === null){ toast('Kontrollera mobilnumret, till exempel 070-123 45 67.'); $('#a-phone').focus(); return; }
    const t = { id:`${S.day}-${uid()}`, day:S.day, seq:nextSeq(b), brand:b, purpose:$('#a-purpose').value, name, phone,
      regnr:$('#a-reg').value.toUpperCase().replace(/[^A-ZÅÄÖ0-9]/g,'').slice(0,6), status:'waiting', createdAt:Date.now(), source:'staff' };
    if (await write(() => store.add(t), `${name} är tillagd i kön`)){ $('#a-name').value=''; $('#a-phone').value=''; $('#a-reg').value=''; }
  }
});
async function addDemo(){
  const names = ['Anna Svensson','Johan Lind','Fatima Rahimi','Erik Nilsson','Maria Holm','Ali Karimi','Sara Ek'];
  const plan = [['kvdbil','hamta'],['autoexperten','inlamning'],['kvdbil','provkor'],['carglass','inlamning'],['kvdbil','lamna'],['autoexperten','upphamtning'],['kvdbil','ovrigt']];
  const now = Date.now(), seqs = {};
  await write(async () => {
    for (let i=0;i<names.length;i++){
      const [b,p] = plan[i]; seqs[b] = (seqs[b] || nextSeq(b) - 1) + 1;
      const bp = brand(b)?.purposes.find(x => x.id===p) ? p : brand(b)?.purposes[0]?.id;
      const t = { id:`${S.day}-${uid()}`, day:S.day, seq:seqs[b], brand:b, purpose:bp, name:names[i], regnr:i%2?'':['ABC123','MLK42X','GHT771','RPO55B'][i/2|0],
        status:'waiting', createdAt:now - (names.length-i)*3*60000, source:'terminal', demo:true };
      if (i===0) Object.assign(t, { status:'called', desk:'u1', calledAt:now - 60000, callCount:1 });
      await store.add(t);
    }
  }, 'Sju exempelkunder är tillagda');
}

/* kiosk escape: hold the corner for a second to reveal the staff menu */
(() => {
  const k = $('#kiosk-key'); let timer;
  const stop = () => { clearTimeout(timer); k.classList.remove('holding'); };
  k.addEventListener('pointerdown', () => { k.classList.add('holding'); timer = setTimeout(() => { stop(); S.navOpen = !S.navOpen; document.body.classList.toggle('nav-open', S.navOpen); }, 1100); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => k.addEventListener(ev, stop));
  k.addEventListener('contextmenu', e => e.preventDefault());
})();

function tickClock(){ document.querySelectorAll('[data-clock]').forEach(el => el.textContent = clock()); }
setInterval(() => {
  tickClock();
  if (S.view==='terminal' && S.term.step!=='brand'){
    const left = Math.ceil((S.term.resetAt - Date.now())/1000);
    const c = $('#t-count'); if (c) c.textContent = `Skärmen återställs om ${Math.max(0,left)} s`;
    if (left <= 0) termReset();
  }
}, 1000);
document.addEventListener('pointerdown', () => { if (S.view==='terminal' && S.term.step!=='brand' && S.term.step!=='done') S.term.resetAt = Date.now() + 60000; }, true);
setInterval(() => {
  if (store && !S.followDay && dayStr() !== S.day){ S.seen = {}; S.firstSnap = true; subscribeTickets(); }
  if (S.view !== 'installningar' && !(S.view==='terminal' && S.term.step==='details')) renderData();
}, 20000);

window.addEventListener('hashchange', route);
route();
tickClock();

(async () => {
  let db = null;
  if (fbConfigured()){
    try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); db.settings({ ignoreUndefinedProperties:true }); }
    catch(e){ console.error('Firebase kunde inte starta', e); db = null; }
  }
  store = db ? fireStore(db) : memStore();
  const pill = $('#mode-pill');
  pill.textContent = store.live ? 'Live' : 'Demoläge';
  pill.classList.toggle('live', store.live);
  if (!store.live) showBanner(FIREBASE_CONFIG.apiKey
    ? 'Demoläge: kunde inte ansluta till Firebase. Kontrollera uppgifterna i FIREBASE_CONFIG. Kön sparas bara i den här fliken.'
    : 'Demoläge: Firebase är inte inställt än, så kön sparas bara i den här fliken. Fyll i FIREBASE_CONFIG överst i index.html.');

  let pruned = false;
  const prune = () => {
    if (pruned || !S.user) return;
    pruned = true;
    store.prune(dayStr(Date.now() - (cfg().retentionDays||30)*864e5)).catch(() => {});
  };
  if (store.live){
    firebase.auth().onAuthStateChanged(u => {
      S.user = u; S.authReady = true;
      $('#logout').hidden = !u;
      if (u) prune();
      subscribePrivate();
      if (S.view==='personal' || S.view==='installningar'){ S.draft = null; S.dirty = false; renderView(); }
    });
  } else S.authReady = true;

  /* The customer's phone only listens to its own brand's queue for its own day */
  if (S.view==='folj' && store.live && S.followId){
    let t = null;
    try { t = await store.getTicket(S.followId); } catch {}
    if (t){ S.followDay = t.day; S.followBrand = t.brand; }
  }
  store.watchConfig(c => {
    S.cfg = c ? { ...clone(DEFAULT_CONFIG), ...c } : null;
    if (S.view==='installningar'){ if (!S.dirty){ S.draft = clone(cfg()); renderView(); } }
    else if (!(S.view==='terminal' && S.term.step==='details')) renderView();
  }, () => {});
  if (S.view==='folj' && store.live && !S.followBrand){ S.loaded = true; S.raw = []; mergeTickets(); renderData(); }
  else subscribeTickets();
})();
</script>
